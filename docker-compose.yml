version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/pmo
      - SPRING_DATASOURCE_USERNAME=pmo
      - SPRING_DATASOURCE_PASSWORD=pmo
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=pmo
      - POSTGRES_USER=pmo
      - POSTGRES_PASSWORD=pmo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmo"]
      interval: 5s
      timeout: 5s
      retries: 5
